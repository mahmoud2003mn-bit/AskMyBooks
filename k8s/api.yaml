apiVersion: apps/v1
kind: Deployment
metadata:
  name: askmybooks-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askmybooks-api
  template:
    metadata:
      labels:
        app: askmybooks-api
    spec:
      containers:
        - name: askmybooks-api
          image: askmybooks-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__Postgres
              value: "Host=postgres-service;Port=5432;Database=askmybooks;Username=postgres;Password=postgres"
            - name: Qdrant__Host
              value: "qdrant-service"
            - name: Qdrant__Port
              value: "6334"
            - name: Llm__BaseUrl
              value: "http://192.168.49.1:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: askmybooks-api-service
spec:
  type: NodePort
  selector:
    app: askmybooks-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30070