apiVersion: v1
kind: ConfigMap
metadata:
  name: askmybooks-gateway-config
data:
  default.conf: |
    server {
      listen 80;

      location /pgadmin/ {
        proxy_pass http://pgadmin-service:80/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
      }

      location /qdrant/ {
        proxy_pass http://qdrant-service:6333/;
        proxy_set_header Host $http_host;
        proxy_redirect off;
      }

      location / {
        proxy_pass http://askmybooks-api-service:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: askmybooks-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askmybooks-gateway
  template:
    metadata:
      labels:
        app: askmybooks-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: askmybooks-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: askmybooks-gateway-service
spec:
  type: NodePort
  selector:
    app: askmybooks-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30071
