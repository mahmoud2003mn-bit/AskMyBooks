apiVersion: apps/v1
kind: Deployment
metadata:
  name: askmybooks-pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askmybooks-pgadmin
  template:
    metadata:
      labels:
        app: askmybooks-pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@askmybooks.com"
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "AskMyBooks2026!"
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
spec:
  selector:
    app: askmybooks-pgadmin
  ports:
    - port: 80
      targetPort: 80