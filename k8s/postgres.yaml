apiVersion: apps/v1
kind: Deployment
metadata:
  name: askmybooks-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askmybooks-postgres
  template:
    metadata:
      labels:
        app: askmybooks-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: askmybooks
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: askmybooks-postgres
  ports:
    - port: 5432
      targetPort: 5432
