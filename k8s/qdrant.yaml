apiVersion: apps/v1
kind: Deployment
metadata:
  name: askmybooks-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askmybooks-qdrant
  template:
    metadata:
      labels:
        app: askmybooks-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.0
          imagePullPolicy: Never
          ports:
            - containerPort: 6333
            - containerPort: 6334
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
spec:
  selector:
    app: askmybooks-qdrant
  ports:
    - name: rest
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
