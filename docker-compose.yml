services:
  postgres:
    image: postgres:16
    container_name: askmybooks-postgres
    environment:
      POSTGRES_DB: askmybooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: askmybooks-qdrant
    ports:
      - "7333:6333"
      - "7334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: